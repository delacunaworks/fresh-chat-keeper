name = "fresh-chat-keeper-api"
main = "src/index.ts"
compatibility_date = "2026-04-27"

# 本番リソースの ID は wrangler コマンドで作成後に埋める想定（B2 の作業）。
# 現状はローカル開発用のプレースホルダー。

# COLLECTION_SALT は P2.5-LEGAL-01 で確定する VTuber 1B 互換 salt。
# wrangler secret put COLLECTION_SALT で本番に設定（ここでは値を持たない）。
# ローカル開発時は .dev.vars に書く（gitignore 済み）。

[[d1_databases]]
binding = "COLLECTION_DB"
database_name = "fck-collection-db"
database_id = "11e45df4-e58f-4842-a018-23ec486e5648"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "3cb19ee1fcb34b83a296009474895862"

[[kv_namespaces]]
binding = "CONSENT_KV"
id = "30f59e56c01c473aab81dd2d08f5faf4"

# 90 日 retention の cron trigger（B2 の retention.ts 実装後に有効化）
# [triggers]
# crons = ["0 3 * * *"]  # 毎日 03:00 UTC
