name = "fresh-chat-keeper-api"
main = "src/index.ts"
compatibility_date = "2026-04-27"

# 本番リソースの ID は wrangler コマンドで作成後に埋める想定（B2 の作業）。
# 現状はローカル開発用のプレースホルダー。

# COLLECTION_SALT は P2.5-LEGAL-01 で確定する VTuber 1B 互換 salt。
# wrangler secret put COLLECTION_SALT で本番に設定（ここでは値を持たない）。
# ローカル開発時は .dev.vars に書く（gitignore 済み）。

[[d1_databases]]
binding = "COLLECTION_DB"
database_name = "fck-collection-db"
database_id = "11e45df4-e58f-4842-a018-23ec486e5648"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "3cb19ee1fcb34b83a296009474895862"

[[kv_namespaces]]
binding = "CONSENT_KV"
id = "30f59e56c01c473aab81dd2d08f5faf4"

# CORS 許可 origin のカンマ区切りリスト。
# Chrome Web Store 公開後の extension ID を本番デプロイ時に置き換える:
#   ALLOWED_ORIGINS = "chrome-extension://<published-extension-id>"
# ローカル開発時は dev セクション側で localhost を含めて上書きする。
[vars]
ALLOWED_ORIGINS = "chrome-extension://placeholder-replace-at-deploy"

# ローカル開発時の上書き（`pnpm dev` / `wrangler dev` のみで使用）
[env.dev.vars]
ALLOWED_ORIGINS = "chrome-extension://localdevextensionidfortesting,http://localhost:5173,http://127.0.0.1:5173"

# 毎日 03:00 UTC に retention cron 起動（B3 で有効化）
[triggers]
crons = ["0 3 * * *"]
